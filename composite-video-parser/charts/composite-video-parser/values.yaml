replicaCount: 1

image:
  repository: composite-video-parser
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  privileged: true
  runAsUser: 0

service:
  type: NodePort
  port: 3100
  nodePort: 30002

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

env:
  CONFIG_PATH: "/app/config.json"

videoDevices:
  enabled: true
  # Preferred mode: mount the host /dev directory at a separate path. The
  # /dev/v4l/by-path symlinks inside that copy point to the current videoN
  # nodes, so a USB rescan or a videoN renumbering does not require changing
  # the pod or the config.
  mountHostDev: true
  hostDevSource: /dev
  hostDevMountPath: /host-dev

  # Fallback when mountHostDev=false: explicit device nodes and the udev
  # symlink directory. Only list nodes that exist on the host.
  hostPaths:
    - /dev/video0
    - /dev/video2
  v4lDir:
    enabled: true
    hostPath: /dev/v4l
