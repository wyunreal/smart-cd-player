apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "composite-video-parser.fullname" . }}
  labels:
    {{- include "composite-video-parser.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "composite-video-parser.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "composite-video-parser.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "composite-video-parser.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.videoDevices.enabled }}
            {{- if .Values.videoDevices.mountHostDev }}
            - name: host-dev
              mountPath: {{ .Values.videoDevices.hostDevMountPath }}
            {{- else }}
            {{- range $i, $path := .Values.videoDevices.hostPaths }}
            - name: video-device-{{ $i }}
              mountPath: {{ $path }}
            {{- end }}
            {{- if .Values.videoDevices.v4lDir.enabled }}
            - name: v4l-dir
              mountPath: {{ .Values.videoDevices.v4lDir.hostPath }}
            {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        {{- if .Values.videoDevices.enabled }}
        {{- if .Values.videoDevices.mountHostDev }}
        - name: host-dev
          hostPath:
            path: {{ .Values.videoDevices.hostDevSource }}
            type: Directory
        {{- else }}
        {{- range $i, $path := .Values.videoDevices.hostPaths }}
        - name: video-device-{{ $i }}
          hostPath:
            path: {{ $path }}
            type: CharDevice
        {{- end }}
        {{- if .Values.videoDevices.v4lDir.enabled }}
        - name: v4l-dir
          hostPath:
            path: {{ .Values.videoDevices.v4lDir.hostPath }}
            type: Directory
        {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
